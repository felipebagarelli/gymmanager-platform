# Producao em uma VPS: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Somente o Caddy publica portas (80/443). Banco e backend ficam na rede interna.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymmanager
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d gymmanager"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
      DB_URL: jdbc:postgresql://db:5432/gymmanager
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      APP_URL: https://${APP_DOMAIN}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-30}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-10}
      # endereco publico do backend (link do responsavel, retorno do checkout, /conta/excluir)
      PUBLIC_URL: https://${API_DOMAIN}
      # e-mail: obrigatorio em producao (sem MAIL_HOST o backend nao sobe)
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-GymManager <nao-responda@gymmanager.local>}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      # termos e privacidade
      TERMS_VERSION: ${TERMS_VERSION:-2026-10-16-rascunho}
      TERMS_URL: ${TERMS_URL:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
      # plano da plataforma (GymManager Pro) e IA que monta treinos
      STRIPE_PLATFORM_WEBHOOK_SECRET: ${STRIPE_PLATFORM_WEBHOOK_SECRET:-}
      PLATFORM_PLAN_ENABLED: ${PLATFORM_PLAN_ENABLED:-false}
      PLATFORM_PLAN_MONTHLY_CENTS: ${PLATFORM_PLAN_MONTHLY_CENTS:-1990}
      PLATFORM_PLAN_YEARLY_CENTS: ${PLATFORM_PLAN_YEARLY_CENTS:-14990}
      PLATFORM_PLAN_TRIAL_DAYS: ${PLATFORM_PLAN_TRIAL_DAYS:-7}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1500}
      AI_PROPOSALS_FREE_PER_MONTH: ${AI_PROPOSALS_FREE_PER_MONTH:-1}
      AI_PROPOSALS_PRO_PER_MONTH: ${AI_PROPOSALS_PRO_PER_MONTH:-30}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
