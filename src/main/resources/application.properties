spring.application.name=gymmanager

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gymmanager}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}

# origens permitidas pelo CORS (painel web em 5173, app Flutter web em 5174)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}


# assistente de IA: sem AI_API_KEY o assistente fica indisponivel (503) e o app sobe normalmente
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:claude-opus-5}
app.ai.max-tokens=${AI_MAX_TOKENS:1500}
app.ai.daily-limit=${AI_DAILY_LIMIT:30}
app.ai.history-messages=10
# propostas de treino pela IA por mes: plano gratis e Pro (teto de custo)
app.ai.proposals.free-per-month=${AI_PROPOSALS_FREE_PER_MONTH:1}
app.ai.proposals.pro-per-month=${AI_PROPOSALS_PRO_PER_MONTH:30}
# foto do aparelho: ate 10 MB (validado de novo no servico)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# cobranca (Stripe Connect): sem STRIPE_SECRET_KEY o modulo fica indisponivel (503) e o app sobe normalmente
app.billing.stripe-secret-key=${STRIPE_SECRET_KEY:}
app.billing.stripe-webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.billing.platform-fee-percent=${PLATFORM_FEE_PERCENT:10}
app.billing.app-url=${APP_URL:http://localhost:5173}
# webhook do endpoint da conta da PLATAFORMA (plano GymManager Pro); o de cima e o do Connect
app.billing.stripe-platform-webhook-secret=${STRIPE_PLATFORM_WEBHOOK_SECRET:}
# plano da plataforma (aluno sem personal): precos em centavos e dias de teste
app.platform-plan.monthly-cents=${PLATFORM_PLAN_MONTHLY_CENTS:1990}
app.platform-plan.yearly-cents=${PLATFORM_PLAN_YEARLY_CENTS:14990}
app.platform-plan.trial-days=${PLATFORM_PLAN_TRIAL_DAYS:7}
# vendas do Pro fechadas ate a IA que monta treinos (Fase D) existir
app.platform-plan.enabled=${PLATFORM_PLAN_ENABLED:false}

# e-mail (confirmacao de cadastro, troca de senha, autorizacao do responsavel).
# Sem MAIL_HOST os e-mails so aparecem no log (desenvolvimento). Brevo, Resend e Amazon SES aceitam SMTP.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:GymManager <nao-responda@gymmanager.local>}
# endereco publico do backend (link de autorizacao do responsavel)
app.public-url=${PUBLIC_URL:http://localhost:8080}

# documentos legais: a versao vigente precisa ser aceita no cadastro
app.legal.terms-version=${TERMS_VERSION:2026-10-16-rascunho}
app.legal.terms-url=${TERMS_URL:}
app.legal.privacy-url=${PRIVACY_URL:}

# saude para orquestrador/balanceador (somente /actuator/health, sem detalhes)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
# atras de proxy reverso (Caddy): respeita X-Forwarded-*
server.forward-headers-strategy=framework
