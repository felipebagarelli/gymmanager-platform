spring.application.name=gymmanager

spring.datasource.url=jdbc:postgresql://localhost:5432/gymmanager
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}

# origens permitidas pelo CORS (painel web em 5173, app Flutter web em 5174)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
